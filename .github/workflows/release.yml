# A v* tag makes a release: goreleaser builds the archives (soju included,
# built by dev/build-soju), publishes them on GitHub and updates the
# Homebrew cask in MaxRenaud/homebrew-tap (its deploy key is TAP_DEPLOY_KEY).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# The actions are pinned to commits (their tags can move), the tag beside
# each; setup-go reads go.mod's toolchain line for the Go to build with.

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
