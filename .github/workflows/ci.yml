# Quick checks on every push: vet, unit tests, and modern-Go fixes. The
# integration test needs the Docker dev environment, so it stays local.
name: ci
on:
  push:
    paths-ignore: ["**.md", "docs/**", "dev/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # trout has code of its own for macOS and Windows (clipboard, keys,
    # its own soju), so the tests run on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: go fix has nothing to change
        run: test -z "$(go fix -diff ./...)"
