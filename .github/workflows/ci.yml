# Quick checks on every push: vet, unit tests, and modern-Go fixes. The
# integration test needs the Docker dev environment, so it stays local.
name: ci
on:
  push:
    # Not for docs or the dev environment, except dev/'s Go packages
    # (in ./...) and build-soju, which the release builds soju with. Later
    # patterns win.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!dev/**"
      - "dev/bot/**"
      - "dev/cachedir/**"
      - "dev/build-soju"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # trout has code of its own for macOS and Windows (clipboard, keys,
    # its own soju), so the tests run on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # Script runs that ask ($?) go on a goroutine of their own, and
      # connections have theirs: the race detector checks they keep to
      # messages. Linux only: it needs cgo, and once is enough.
      - name: race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...
      - name: go fix has nothing to change
        run: test -z "$(go fix -diff ./...)"
